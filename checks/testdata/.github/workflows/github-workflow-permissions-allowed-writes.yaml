name: allowed writes
on: [push]
permissions:
  contents: read

jobs:
  delete-packages:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0

  call-local-workflow:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/github-workflow-permissions-called-workflow.yaml

  call-missing-local-workflow:
    permissions:
      contents: write
    uses: ./.github/workflows/missing.yaml

  call-remote-workflow:
    permissions:
      contents: write
    uses: octo-org/workflows/.github/workflows/publish.yml@v1

  other-packages:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

  wrong-permission:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/delete-package-versions@v5

  similar-action:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions-fork@v5
